services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scene-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8081:8081" # Porta do React Native / Metro Bundler
    command: tail -f /dev/null

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scene-backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:3000" # Porta padrão para um backend Node.js (ex: Express/NestJS)
    command: sh -c "npm install && npm run dev"
